<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADANAR - Food Ordering</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #e67e22, #d35400); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .cart-btn { background: #f1c40f; color: #333; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; position: relative; }
        .badge { background: #e74c3c; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; position: absolute; top: -5px; right: -5px; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .menu-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .menu-img { width: 100%; height: 120px; object-fit: cover; }
        .menu-info { padding: 10px; }
        .menu-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .menu-price { color: #e67e22; font-weight: bold; }
        .order-btn { background: #e67e22; color: white; border: none; padding: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        
        /* Modal Cart */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-end; }
        .modal-content { background: white; width: 100%; max-width: 600px; border-top-left-radius: 15px; border-top-right-radius: 15px; padding: 20px; max-height: 80vh; overflow-y: auto; box-sizing: border-box; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        .checkout-btn { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>YADANAR Fastfood</h2>
        <button class="cart-btn" onclick="toggleCart()">🛒 ခြင်းတောင်း <span id="cartCount" class="badge">0</span></button>
    </div>

    <div class="container">
        <h3>ဟင်းပွဲ မီနူးများ</h3>
        <div id="menuGrid" class="menu-grid">
            <!-- Dynamic Menu Loaded Here -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <h3>မှာယူမည့် စာရင်း (Cart)</h3>
            <div id="cartItemsList"></div>
            <hr>
            <h4>ကျသင့်ငွေ စုစုပေါင်း: <span id="totalPrice">0</span> THB</h4>
            
            <div class="form-group">
                <label>ကဒ်နံပါတ် (30160 - 30500) *</label>
                <input type="number" id="custCode" placeholder="ဥပမာ - 30276" min="30160" max="30500">
            </div>
            <div class="form-group">
                <label>အဆောင် *</label>
                <select id="building">
                    <option value="A">A အဆောင်</option>
                    <option value="B">B အဆောင်</option>
                </select>
            </div>
            <div class="form-group">
                <label>အခန်းနံပါတ် *</label>
                <input type="text" id="roomNo" placeholder="ဥပမာ - 1/1">
            </div>
            <button class="checkout-btn" onclick="submitOrder()">✅ အော်ဒါ ပေးပို့မည်</button>
            <button onclick="toggleCart()" style="background:#ccc; border:none; padding:10px; width:100%; margin-top:5px; border-radius:5px; cursor:pointer;">ပိတ်မည်</button>
        </div>
    </div>

    <script>
        // နမူနာ မီနူးအချက်အလက်များ (Google Sheet နှင့် ချိတ်ဆက်နိုင်သည်)
        const menus = [
            { code: "001", name: "ထမင်းဖြူ", price: 10, img: "https://via.placeholder.com/300x200?text=Rice" },
            { code: "002", name: "ကြက်ဥကြော်", price: 10, img: "https://via.placeholder.com/300x200?text=Fried+Egg" },
            { code: "003", name: "ရခိုင်မုန့်တီ(အရည်)", price: 30, img: "https://via.placeholder.com/300x200?text=Mohinga" },
            { code: "004", name: "ရခိုင်မုန့်တီ(အသུပ်)", price: 30, img: "https://via.placeholder.com/300x200?text=Thoke" }
        ];

        let cart = {};

        function renderMenu() {
            let grid = document.getElementById("menuGrid");
            grid.innerHTML = "";
            menus.forEach(m => {
                grid.innerHTML += `
                    <div class="menu-card">
                        <img src="${m.img}" class="menu-img">
                        <div class="menu-info">
                            <div class="menu-title">[${m.code}] ${m.name}</div>
                            <div class="menu-price">${m.price} THB</div>
                        </div>
                        <button class="order-btn" onclick="addToCart('${m.code}')">ယူမည်</button>
                    </div>
                `;
            });
        }

        function addToCart(code) {
            let item = menus.find(m => m.code === code);
            if (!cart[code]) {
                cart[code] = { ...item, qty: 1 };
            } else {
                cart[code].qty++;
            }
            updateCartUI();
        }

        function changeQty(code, delta) {
            if (cart[code]) {
                cart[code].qty += delta;
                if (cart[code].qty <= 0) delete cart[code];
                updateCartUI();
            }
        }

        function updateCartUI() {
            let count = 0;
            let total = 0;
            let list = document.getElementById("cartItemsList");
            list.innerHTML = "";

            for (let code in cart) {
                let item = cart[code];
                count += item.qty;
                total += item.price * item.qty;
                list.innerHTML += `
                    <div class="cart-item">
                        <div><b>${item.name}</b><br><small>${item.price} THB x ${item.qty}</small></div>
                        <div>
                            <button onclick="changeQty('${code}', -1)">-</button>
                            <span style="margin: 0 10px;">${item.qty}</span>
                            <button onclick="changeQty('${code}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById("cartCount").innerText = count;
            document.getElementById("totalPrice").innerText = total;
        }

        function toggleCart() {
            let modal = document.getElementById("cartModal");
            modal.style.display = modal.style.display === "flex" ? "none" : "flex";
        }

        function submitOrder() {
            let custCode = document.getElementById("custCode").value.trim();
            let building = document.getElementById("building").value;
            let roomNo = document.getElementById("roomNo").value.trim();

            if (!custCode || custCode < 30160 || custCode > 30500) {
                alert("ကျေးဇူးပြု၍ မှန်ကန်သော ကဒ်နံပါတ် (30160 မှ 30500 ကြား) ထည့်ပါ။");
                return;
            }
            if (!roomNo) {
                alert("ကျေးဇူးပြု၍ အခန်းနံပါတ် ဖြည့်ပါ။");
                return;
            }
            if (Object.keys(cart).length === 0) {
                alert("ခြင်းတောင်းထဲတွင် ဟင်းပွဲ မရှိသေးပါ။");
                return;
            }

            let itemsText = [];
            for (let code in cart) {
                itemsText.push(`${code} ${cart[code].qty}`);
            }

            let fullMessage = `${custCode} ${building} ${roomNo} ${itemsText.join(", ")}`;

            // LINE LIFF မှတဆင့် Chat သို့ စာ ပို့ခြင်း
            if (typeof liff !== "undefined" && liff.isInClient()) {
                liff.sendMessages([{ type: "text", text: fullMessage }])
                    .then(() => { liff.closeWindow(); })
                    .catch((err) => { alert("ပို့ဆောင်ရာတွင် အမှားရှိပါသည်: " + err); });
            } else {
                alert("ပေးပို့မည့် စာသား: \n" + fullMessage);
            }
        }

        // LIFF Initialize
        liff.init({ liffId: "2012553209-N027oZ5k" }).catch(err => console.log("LIFF Initialization failed"));
        renderMenu();
    </script>
</body>
</html>
