<!DOCTYPE html>
<html lang="my" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADANAR - Food Ordering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Padauk', sans-serif; }</style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased selection:bg-amber-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-gradient-to-r from-red-600 via-amber-500 to-amber-600 text-white shadow-lg">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2.5 rounded-full backdrop-blur-md flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-utensils text-yellow-300 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-yellow-100">YADANAR</h1>
                    <p class="text-xs font-semibold text-amber-100">Fastfood ဟင်းမျိုးစုံ</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openCartModal()" class="p-2.5 rounded-full bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-bold flex items-center gap-2 relative shadow-md">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartBadge" class="hidden absolute -top-1.5 -right-1.5 bg-red-600 text-white text-xs rounded-full w-5 h-5 items-center justify-center font-bold border-2 border-white">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        <h2 class="text-xl font-bold text-slate-800 mb-4">ဟင်းပွဲ မီနူးများ</h2>
        <div id="menuGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <div class="col-span-full py-12 text-center text-slate-400 text-xs">
                <i class="fa-solid fa-spinner animate-spin text-2xl text-amber-500 mb-2"></i>
                <p>မီနူးဒေတာများ ဆွဲယူနေပါသည်...</p>
            </div>
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl relative">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">မှာယူမည့် စာရင်း (Cart)</h3>
                <button onclick="toggleModal('cartModal', false)" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <!-- Cart Items List with +/- buttons -->
            <div id="cartItemsList" class="flex-grow overflow-y-auto p-4 space-y-3"></div>

            <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
                <div class="flex justify-between text-base font-bold text-slate-900">
                    <span>ကျသင့်ငွေ စုစုပေါင်း:</span>
                    <span id="cartTotalPrice" class="text-amber-600">0 THB</span>
                </div>

                <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-2 pt-2 border-t border-slate-200">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ဝယ်သူ အကောင့်ကုဒ်နံပါတ် (Customer Code) <span class="text-red-500">*</span></label>
                        <input type="text" id="custCode" required placeholder="ဥပမာ - 30413" class="w-full text-xs px-3 py-2 border rounded-lg font-mono font-bold text-amber-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ဝယ်သူ အမည် <span class="text-red-500">*</span></label>
                        <input type="text" id="custName" required placeholder="ဥပမာ - မဲ့စော်ကက်" class="w-full text-xs px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ပို့ဆောင်ရမည့် အခန်း <span class="text-red-500">*</span></label>
                        <input type="text" id="custRoom" required placeholder="ဥပမာ - B 3/6" class="w-full text-xs px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ငွေချေမှု စနစ် ရွေးချယ်ရန် <span class="text-red-500">*</span></label>
                        <select id="paymentType" required class="w-full text-xs px-3 py-2 border rounded-lg font-bold text-slate-800 bg-white">
                            <option value="လက်ငင်း">လက်ငင်းစနစ် (Cash/Transfer)</option>
                            <option value="အကြွေး">အကြွေးစနစ် (လကုန်ရှင်း)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">မှတ်ချက်</label>
                        <input type="text" id="custNote" placeholder="ဥပမာ - အစပ်ကဲပေးပါ" class="w-full text-xs px-3 py-2 border rounded-lg">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full mt-3 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> အော်ဒါ ပေးပို့မည်
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 👉 သင့် Google Sheet ၏ Web App URL ကို ဤနေရာတွင် ထည့်သွင်းပေးပါ
        const sheetUrl = "https://script.google.com/macros/s/AKfycbz7zFylfhFXtNy_VYv6IOpFNeXVfQI3Ehf4xcVoHGN8nxlr4wMLo_fXfxlpwMgWU5it/exec";

        let menuItems = [];
        let cart = {};

        document.addEventListener("DOMContentLoaded", async () => {
            if (sheetUrl && !sheetUrl.includes("AKfycbxAl1...")) {
                await fetchMenu();
            } else {
                document.getElementById("menuGrid").innerHTML = `
                    <div class="col-span-full py-12 text-center text-red-500 text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>Google Sheet URL ထည့်သွင်းရန် ကုဒ်အတွင်းရှိ sheetUrl အရှင်ကို စစ်ဆေးပါ။</p>
                    </div>
                `;
            }
        });

        async function fetchMenu() {
            try {
                const res = await fetch(sheetUrl + "?action=getMenu");
                const data = await res.json();
                if (data.result === "success" && data.menu) {
                    menuItems = data.menu;
                }
            } catch (e) {
                console.error(e);
            }
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById("menuGrid");
            const activeMenus = menuItems.filter(item => item.status !== false && item.status !== "false" && item.status !== "FALSE");

            if (activeMenus.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-10">လက်တလော ရရှိနိုင်သော မီနူးများ မရှိသေးပါ။</p>`;
                return;
            }

            grid.innerHTML = activeMenus.map(item => `
                <div class="bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col justify-between shadow-sm">
                    <div class="relative h-32 bg-slate-100">
                        <img src="${item.image || 'https://via.placeholder.com/300'}" class="h-full w-full object-cover">
                        <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[10px] font-mono px-1.5 py-0.5 rounded font-bold">${item.code}</span>
                        ${item.tag ? `<span class="absolute top-2 right-2 bg-red-600 text-white text-[9px] uppercase px-1.5 py-0.5 rounded-full font-bold">${item.tag}</span>` : ''}
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="font-bold text-xs text-slate-800">${item.name}</h3>
                            <p class="text-amber-600 font-extrabold text-xs mt-1">${Number(item.price).toLocaleString()} THB</p>
                        </div>
                        <button onclick="addToCart('${item.code}')" class="mt-2 bg-amber-500 hover:bg-amber-600 text-white font-bold py-1.5 rounded text-xs transition">မှာယူမည်</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(code) {
            if (cart[code]) {
                cart[code].qty += 1;
            } else {
                const item = menuItems.find(m => m.code === code);
                if (item) cart[code] = { ...item, qty: 1 };
            }
            updateCartUI();
        }

        // ➖ အရေအတွက် လျှော့ချသည့် လုပ်ဆောင်ချက်
        function decreaseQty(code) {
            if (cart[code]) {
                cart[code].qty -= 1;
                if (cart[code].qty <= 0) {
                    delete cart[code]; // ၀ သို့မဟုတ် အောက်ရောက်ပါက Cart ထဲမှ ဖယ်ရှားမည်
                }
            }
            updateCartUI();
        }

        // ➕ အရေအတွက် တိုးမြှင့်သည့် လုပ်ဆောင်ချက်
        function increaseQty(code) {
            if (cart[code]) {
                cart[code].qty += 1;
            }
            updateCartUI();
        }

        function updateCartUI() {
            const keys = Object.keys(cart);
            let total = 0;
            const list = document.getElementById("cartItemsList");
            
            if (keys.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">မှာယူမည့် စာရင်း မရှိသေးပါ။</p>`;
            } else {
                list.innerHTML = keys.map(k => {
                    const itemTotal = cart[k].price * cart[k].qty;
                    total += itemTotal;
                    return `
                        <div class="flex justify-between items-center text-xs py-2 border-b">
                            <div class="flex-grow">
                                <span class="font-bold text-slate-800 block">${cart[k].name}</span>
                                <span class="text-amber-600 font-semibold">${cart[k].price} THB x ${cart[k].qty} = ${itemTotal} THB</span>
                            </div>
                            <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border">
                                <button onclick="decreaseQty('${k}')" class="w-6 h-6 bg-white border rounded shadow-sm text-slate-700 hover:bg-red-100 hover:text-red-600 font-bold flex items-center justify-center">-</button>
                                <span class="w-6 text-center font-bold text-slate-800">${cart[k].qty}</span>
                                <button onclick="increaseQty('${k}')" class="w-6 h-6 bg-white border rounded shadow-sm text-slate-700 hover:bg-green-100 hover:text-green-600 font-bold flex items-center justify-center">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById("cartTotalPrice").innerText = `${total.toLocaleString()} THB`;
            document.getElementById("cartBadge").innerText = keys.length;
            document.getElementById("cartBadge").classList.toggle("hidden", keys.length === 0);
        }

        function openCartModal() {
            document.getElementById("custCode").value = localStorage.getItem("yadanar_cust_code") || "";
            document.getElementById("custName").value = localStorage.getItem("yadanar_cust_name") || "";
            document.getElementById("custRoom").value = localStorage.getItem("yadanar_cust_room") || "";
            updateCartUI();
            toggleModal('cartModal', true);
        }

        async function submitOrder(e) {
            e.preventDefault();
            const keys = Object.keys(cart);
            if (keys.length === 0) return alert("ဟင်းပွဲ ရွေးချယ်ပါ");

            const code = document.getElementById("custCode").value.trim();
            const name = document.getElementById("custName").value.trim();
            const room = document.getElementById("custRoom").value.trim();

            localStorage.setItem("yadanar_cust_code", code);
            localStorage.setItem("yadanar_cust_name", name);
            localStorage.setItem("yadanar_cust_room", room);

            const payload = {
                orderId: "ORD-" + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toLocaleString("my-MM"),
                customer: `[${code}] ${name}`,
                room: room,
                paymentType: document.getElementById("paymentType").value,
                items: keys.map(k => `${cart[k].name} (${cart[k].qty}ပွဲ)`).join(", "),
                total: keys.reduce((sum, k) => sum + (cart[k].price * cart[k].qty), 0),
                note: document.getElementById("custNote").value
            };

            if (sheetUrl) {
                await fetch(sheetUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }
            alert("အော်ဒါ ပေးပို့မှု အောင်မြင်ပါသည်။");
            cart = {};
            updateCartUI();
            toggleModal("cartModal", false);
        }

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle("hidden", !show);
        }
    </script>
</body>
</html>
